name: jdonuts_customer_app
description: "J’Donuts customer app take-home project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  drift: ^2.35.4
  path: ^1.9.1
  path_provider: ^2.1.6
  go_router: ^18.1.3
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_svg: ^2.3.2
  connectivity_plus: ^7.3.2
  cached_network_image: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/catalog.json
    - assets/images/
    - assets/images/donuts/
    - assets/images/catalog/
    - assets/fonts/ADLaMDisplay-OFL.txt
    - assets/fonts/Abel-OFL.txt
    - assets/fonts/NotoSansMyanmar-OFL.txt

  fonts:
    - family: ADLaMDisplay
      fonts:
        - asset: assets/fonts/ADLaMDisplay-Regular.ttf
    - family: Abel
      fonts:
        - asset: assets/fonts/Abel-Regular.ttf
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar.ttf
